{
    "jobs": [
        {
            "name": "init",
            "cmds": [
                "setparam sys.beyond2lte.usb.prepared 0",
                "setparam sys.beyond2lte.usb.bound 0",
                "setparam sys.usb.ffs.ready.hdc 0",
                "mkdir /config 0755 root root",
                "mount configfs none /config",
                "mkdir /dev/usb-ffs 0770 shell shell",
                "mkdir /dev/usb-ffs/hdc 0770 shell shell",
                "mkdir /config/usb_gadget/beyond2lte_hdc 0770 root shell",
                "write /config/usb_gadget/beyond2lte_hdc/idVendor 0x12D1",
                "write /config/usb_gadget/beyond2lte_hdc/idProduct 0x5000",
                "write /config/usb_gadget/beyond2lte_hdc/bcdDevice 0x0100",
                "write /config/usb_gadget/beyond2lte_hdc/bcdUSB 0x0200",
                "mkdir /config/usb_gadget/beyond2lte_hdc/strings/0x409 0770 root shell",
                "write /config/usb_gadget/beyond2lte_hdc/strings/0x409/serialnumber beyond2lte-dev",
                "write /config/usb_gadget/beyond2lte_hdc/strings/0x409/manufacturer OpenHarmony",
                "write /config/usb_gadget/beyond2lte_hdc/strings/0x409/product \"S10+ HDC Development\"",
                "mkdir /config/usb_gadget/beyond2lte_hdc/functions/ffs.hdc",
                "mkdir /config/usb_gadget/beyond2lte_hdc/configs/b.1 0770 root shell",
                "mkdir /config/usb_gadget/beyond2lte_hdc/configs/b.1/strings/0x409 0770 root shell",
                "write /config/usb_gadget/beyond2lte_hdc/configs/b.1/strings/0x409/configuration HDC",
                "write /config/usb_gadget/beyond2lte_hdc/configs/b.1/MaxPower 500",
                "write /config/usb_gadget/beyond2lte_hdc/os_desc/use 1",
                "write /config/usb_gadget/beyond2lte_hdc/os_desc/b_vendor_code 0x1",
                "write /config/usb_gadget/beyond2lte_hdc/os_desc/qw_sign MSFT100",
                "symlink /config/usb_gadget/beyond2lte_hdc/configs/b.1 /config/usb_gadget/beyond2lte_hdc/os_desc/b.1",
                "symlink /config/usb_gadget/beyond2lte_hdc/functions/ffs.hdc /config/usb_gadget/beyond2lte_hdc/configs/b.1/f1",
                "mount functionfs hdc /dev/usb-ffs/hdc uid=2000,gid=2000"
            ]
        },
        {
            "name": "boot",
            "cmds": [
                "start beyond2lte_usb"
            ]
        },
        {
            "name": "param:sys.beyond2lte.usb.prepared=1",
            "condition": "sys.beyond2lte.usb.prepared=1",
            "cmds": [
                "setparam persist.hdc.mode.usb enable",
                "start hdcd"
            ]
        },
        {
            "name": "param:init.svc.hdcd=stopped",
            "condition": "init.svc.hdcd=stopped",
            "cmds": [
                "setparam sys.usb.ffs.ready.hdc 0"
            ]
        }
    ],
    "services": [
        {
            "name": "beyond2lte_usb",
            "path": [
                "/vendor/bin/beyond2lte_usb"
            ],
            "uid": "root",
            "gid": [
                "root",
                "shell"
            ],
            "start-mode": "condition",
            "disabled": 1,
            "sandbox": 0
        }
    ]
}
